name: Node.js CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x] # Utilisez la version de Node.js appropriée pour votre application

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Installation des dépendances
        run: npm install

      - name: Build de l'application
        run: npm run build

      - name: Vérification des fichiers construits
        run: ls -la ./dist/

      - name: Déploiement via FTP
        # Audit 🟡 : un simple PR déclenchait le déploiement FTP avec la branche
        # courante — le build reste une validation CI, le déploiement ne tourne
        # que sur un push vers main.
        if: github.event_name == 'push'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
