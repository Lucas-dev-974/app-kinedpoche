server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Audit 🟡 : en-têtes de sécurité de base. CSP stricte et HSTS volontairement
  # absent (risque de casser le style inline de l'app / dépend du domaine et du
  # TLS en amont) — à ajouter quand le domaine est figé.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Fichiers à ne jamais cacher : point d'entrée SPA + service worker
  location = /index.html {
    add_header Cache-Control "no-cache";
    # nginx : les locations avec add_header n'héritent PLUS des add_header du
    # server — il faut répéter les en-têtes ici
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Assets fingerprintés : cache long
  location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?|pdf)$ {
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
